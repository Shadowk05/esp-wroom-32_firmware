; PlatformIO Project Configuration File
;
; Build options: build flags, source filter
; Upload options: custom upload port, speed and extra flags
; Library options: dependencies, extra library storages
; Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = ideaspark-esp32
extra_configs = boards/ideaspark-esp32/ideaspark-esp32.ini

[env]
framework = arduino, espidf
platform = espressif32 @ ^6.0.0

build_flags =
    -Wall
    -Wextra
    -O2
    -D_GNU_SOURCE
    -DUSING_PLATFORMIO=1
    -std=c++17
    -fno-exceptions
    -fno-rtti
    -Wno-error=deprecated-declarations

build_unflags = 
    -fno-strict-volatile-bitfields

lib_deps =
    bblanchon/ArduinoJson @ ^6.19.4
    me-no-dev/ESP Async WebServer @ ^1.2.3
    me-no-dev/AsyncTCP @ ^1.1.1
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.5
    arduino-libraries/WiFi @ ^1.2.7
    arduino-libraries/Wire @ ^1.0.0
    arduino-libraries/SPI @ ^1.0.6

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

[env:ideaspark-esp32]
extends = env
board = esp32
board_build.partitions = default.csv
build_src_filter = +<src/> -<.git/> -<.pio> -<boards/> +<boards/ideaspark-esp32/>

build_flags =
    ${env.build_flags}
    -Iboards/ideaspark-esp32
    -DDEVICE_NAME='"Ideaspark ESP32 OLED"'
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DIDEASPARK_ESP32=1

lib_deps =
    ${env.lib_deps}
    ricmoo/QR-Code-generator @ ^1.8.0
    bblanchon/Tinyxml2 @ ^10.0.0

upload_speed = 460800
upload_protocol = esptool
upload_port = /dev/ttyUSB0

; For Windows, change upload_port to:
; upload_port = COM3
