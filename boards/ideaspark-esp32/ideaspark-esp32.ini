; PlatformIO Project Configuration File for Ideaspark ESP-WROOM-32 with OLED
;
; Build options: build flags, source filter
; Upload options: custom upload port, speed and extra flags
; Library options: dependencies, extra library storages
; Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:ideaspark-esp32]
board = esp32
board_build.partitions = default.csv
board_build.arduino.memory_type = dio_qio
monitor_speed = 115200
build_src_filter = ${env.build_src_filter} +<../boards/ideaspark-esp32>

build_flags =
    ${env.build_flags}
    -Iboards/ideaspark-esp32
    -DDEVICE_NAME='"Ideaspark ESP32 OLED"'
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
    
    ; OLED Display Configuration
    -DHAS_OLED_DISPLAY=1
    -DOLED_SDA=21
    -DOLED_SCL=22
    -DOLED_ADDR=0x3C
    -DOLED_WIDTH=128
    -DOLED_HEIGHT=64
    
    ; Button Pins
    -DUP_BTN=34
    -DDW_BTN=35
    -DL_BTN=32
    -DR_BTN=33
    -DSEL_BTN=27
    -DESC_BTN=14
    
    ; IR LED pins
    -DIR_TX_PINS='{"GPIO 25", 25}'
    -DIR_RX_PINS='{"GPIO 26", 26}'
    -DTXLED=25
    -DLED_ON=HIGH
    -DLED_OFF=LOW
    
    ; RF Module (CC1101 SubGhz)
    -DRF_TX_PINS='{"CC1101", 25}'
    -DRF_RX_PINS='{"CC1101", 26}'
    -DCC1101_CS=5
    -DCC1101_GDO0=16
    
    ; NRF24 Configuration
    -DNRF24_CS=17
    -DNRF24_CE=4
    
    ; SD Card Pins
    -DSDCARD_CS=4
    -DSDCARD_SCK=18
    -DSDCARD_MISO=19
    -DSDCARD_MOSI=23
    
    ; SPI Configuration
    -DSPI_MOSI=23
    -DSPI_MISO=19
    -DSPI_SCK=18
    
    ; I2C Configuration
    -DI2C_SDA=21
    -DI2C_SCL=22
    -DI2C_FREQ=400000
    
    ; Battery Configuration
    -DBAT_PIN=36
    -DBAT_ADC_CHANNEL=ADC1_CH0
    
    ; Serial Configuration
    -DSERIAL_TX=1
    -DSERIAL_RX=3
    -DGPS_SERIAL_TX=1
    -DGPS_SERIAL_RX=3
    
    ; Features (disabled to save memory)
    -DLITE_VERSION=1
    -DFEATURE_RFID=0
    -DFEATURE_NFC=0
    
    ; Memory optimization
    -DBOARD_HAS_PSRAM=0
    -ffunction-sections
    -fdata-sections
    
lib_deps =
    ESP Async WebServer
    AsyncTCP
    WiFiClientSecure
    SPIFFS
    Wire
    SPI

upload_speed = 460800
upload_port = /dev/ttyUSB0

; For Windows, uncomment the line below
; upload_port = COM3
